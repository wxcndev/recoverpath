[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wxcndev-recoverpath"
version = "0.1.0"
description = "沿执行链标出失败点、恢复动作与恢复结果，给出恢复成功率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "wxcndev" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://wxcndev.github.io"
Repository = "https://github.com/wxcndev/recoverpath"
Issues = "https://github.com/wxcndev/recoverpath/issues"

[project.scripts]
recoverpath = "recoverpath:main"

[tool.setuptools]
py-modules = ["recoverpath"]
